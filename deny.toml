[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
unmaintained = "workspace"
ignore = [
  # `openidconnect` verifies public signatures here; ModelPort performs no RSA
  # private-key operations. Remove when the transitive `rsa` advisory is fixed.
  "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  { name = "native-tls", reason = "ModelPort standardizes on rustls" },
  { name = "openssl", reason = "ModelPort standardizes on rustls" },
  { name = "openssl-sys", reason = "ModelPort standardizes on rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true
