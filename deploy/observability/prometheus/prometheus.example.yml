global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/modelport-alerts.yml

scrape_configs:
  - job_name: modelport
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/modelport_metrics_key
    static_configs:
      - targets:
          - modelport:38082

  # Optional readiness probe. Run Blackbox Exporter with
  # blackbox.example.yml and mount the same dedicated, scoped probe key.
  - job_name: modelport-readiness
    metrics_path: /probe
    params:
      module:
        - modelport_ready
    static_configs:
      - targets:
          - http://modelport:38082/readyz
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
