name: routepilot-production

# Phase-one production profile: one RoutePilot instance, an external managed
# PostgreSQL database, and secret-manager-rendered runtime environment. This
# file deliberately has no PostgreSQL service and no repository .env mount.
services:
  routepilot:
    image: ${ROUTEPILOT_IMAGE:?set a digest-pinned RoutePilot image}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file:
      - path: ${ROUTEPILOT_RUNTIME_ENV_FILE:?set a secret-manager-rendered runtime env file}
        required: true
    environment:
      ROUTEPILOT_BIND: 0.0.0.0:38082
      ROUTEPILOT_CONFIG: /config/config.toml
      ROUTEPILOT_ENV_FILE: /run/routepilot/no-repository-env
      ROUTEPILOT_STATE_DIR: /data
      ROUTEPILOT_ENTERPRISE_MODE: "1"
      ROUTEPILOT_DATABASE_TLS_MODE: verify-full
      ROUTEPILOT_REQUIRE_CONTROL_API_KEYS: "1"
      ROUTEPILOT_ADMIN_COOKIE_SECURE: "1"
      ROUTEPILOT_LOCAL_EXECUTING_PER_USER: "1"
      ROUTEPILOT_LOCAL_QUEUED_PER_USER: "2"
      ROUTEPILOT_LOCAL_QUEUE_GLOBAL: "16"
      ROUTEPILOT_BATCH_QUEUE_GLOBAL: "16"
      ROUTEPILOT_LOCAL_OVERFLOW_AFTER_SECONDS: "5"
      ROUTEPILOT_LOCAL_STRICT_WAIT_SECONDS: "60"
      ROUTEPILOT_FINALIZATION_DRAIN_TIMEOUT_SECONDS: "30"
      ROUTEPILOT_REQUEST_DETAIL_RETENTION_DAYS: "30"
      ROUTEPILOT_USER_USAGE_RETENTION_DAYS: "90"
      ROUTEPILOT_AUDIT_RETENTION_DAYS: "395"
      ROUTEPILOT_RETENTION_LEGAL_HOLD: ${ROUTEPILOT_RETENTION_LEGAL_HOLD:-0}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${ROUTEPILOT_API_PUBLISH:-127.0.0.1:38082}:38082
    volumes:
      - routepilot-data:/data
      - type: bind
        source: ${ROUTEPILOT_CONFIG_FILE:?set the reviewed non-secret config.toml path}
        target: /config/config.toml
        read_only: true
      - type: bind
        source: ${ROUTEPILOT_DATABASE_CA_FILE:?set the managed PostgreSQL CA file}
        target: /run/routepilot/database-ca.pem
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          probe_key="$${ROUTEPILOT_HEALTHCHECK_API_KEY:-}";
          test -n "$${probe_key}" &&
          curl -fsS -H "x-api-key: $${probe_key}" http://127.0.0.1:38082/readyz >/dev/null
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    restart: unless-stopped
    stop_grace_period: ${ROUTEPILOT_STOP_GRACE_PERIOD:-11m}
    logging:
      driver: json-file
      options:
        max-size: ${ROUTEPILOT_LOG_MAX_SIZE:-10m}
        max-file: "${ROUTEPILOT_LOG_MAX_FILES:-5}"

  dashboard:
    image: ${ROUTEPILOT_DASHBOARD_IMAGE:?set a digest-pinned dashboard image}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - ${ROUTEPILOT_DASHBOARD_PUBLISH:-127.0.0.1:33002}:8080
    restart: unless-stopped
    stop_grace_period: ${ROUTEPILOT_DASHBOARD_STOP_GRACE_PERIOD:-30s}
    logging:
      driver: json-file
      options:
        max-size: ${ROUTEPILOT_LOG_MAX_SIZE:-10m}
        max-file: "${ROUTEPILOT_LOG_MAX_FILES:-5}"

volumes:
  routepilot-data:

networks:
  default:
    name: ${ROUTEPILOT_NETWORK_NAME:-routepilot_default}
    external: true
