name: routepilot

# Versioned Small-Team Beta release profile. This file is used from a tagged
# source checkout and pulls signed GHCR images instead of compiling source.
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${ROUTEPILOT_POSTGRES_DB:-routepilot}
      POSTGRES_USER: ${ROUTEPILOT_POSTGRES_USER:-routepilot}
      POSTGRES_PASSWORD: ${ROUTEPILOT_POSTGRES_PASSWORD:?set ROUTEPILOT_POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - routepilot-postgres-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: ${ROUTEPILOT_POSTGRES_STOP_GRACE_PERIOD:-1m}
    logging:
      driver: json-file
      options:
        max-size: ${ROUTEPILOT_LOG_MAX_SIZE:-10m}
        max-file: "${ROUTEPILOT_LOG_MAX_FILES:-5}"

  routepilot:
    image: ${ROUTEPILOT_IMAGE:-ghcr.io/lizzjin/routepilot:0.1.0}
    pull_policy: ${ROUTEPILOT_PULL_POLICY:-missing}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file:
      - ${ROUTEPILOT_COMPOSE_ENV_FILE:-../../.env}
    environment:
      ROUTEPILOT_BIND: 0.0.0.0:38082
      ROUTEPILOT_ENV_FILE: /config/.env
      ROUTEPILOT_STATE_DIR: /data
      ROUTEPILOT_CONFIG: /config/config.toml
      ROUTEPILOT_DATABASE_URL: ${ROUTEPILOT_DATABASE_URL:-postgres://${ROUTEPILOT_POSTGRES_USER:-routepilot}:${ROUTEPILOT_POSTGRES_PASSWORD:?set ROUTEPILOT_POSTGRES_PASSWORD in .env}@postgres:5432/${ROUTEPILOT_POSTGRES_DB:-routepilot}}
      ROUTEPILOT_TRUSTED_PROXIES: ${ROUTEPILOT_TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
      ROUTEPILOT_ALLOWED_ORIGINS: ${ROUTEPILOT_ALLOWED_ORIGINS:-}
      RUST_LOG: ${RUST_LOG:-routepilot=info,tower_http=info}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${ROUTEPILOT_API_PUBLISH:-127.0.0.1:38082}:38082
    volumes:
      - routepilot-data:/data
      - type: bind
        source: ${ROUTEPILOT_COMPOSE_ENV_FILE:-../../.env}
        target: /config/.env
        read_only: true
      - type: bind
        source: ${ROUTEPILOT_CONFIG_FILE:-../../config.toml}
        target: /config/config.toml
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          probe_key="$${ROUTEPILOT_HEALTHCHECK_API_KEY:-$${ROUTEPILOT_AUTH_TOKEN:-}}";
          test -n "$${probe_key}" &&
          curl -fsS -H "x-api-key: $${probe_key}" http://127.0.0.1:38082/readyz >/dev/null
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    restart: unless-stopped
    stop_grace_period: ${ROUTEPILOT_STOP_GRACE_PERIOD:-11m}
    logging:
      driver: json-file
      options:
        max-size: ${ROUTEPILOT_LOG_MAX_SIZE:-10m}
        max-file: "${ROUTEPILOT_LOG_MAX_FILES:-5}"

  dashboard:
    image: ${ROUTEPILOT_DASHBOARD_IMAGE:-ghcr.io/lizzjin/routepilot-dashboard:0.1.0}
    pull_policy: ${ROUTEPILOT_PULL_POLICY:-missing}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - ${ROUTEPILOT_DASHBOARD_PUBLISH:-127.0.0.1:33002}:8080
    restart: unless-stopped
    stop_grace_period: ${ROUTEPILOT_DASHBOARD_STOP_GRACE_PERIOD:-30s}
    logging:
      driver: json-file
      options:
        max-size: ${ROUTEPILOT_LOG_MAX_SIZE:-10m}
        max-file: "${ROUTEPILOT_LOG_MAX_FILES:-5}"

  ops-agent:
    profiles: ["ops-agent"]
    image: ${ROUTEPILOT_OPS_AGENT_IMAGE:-ghcr.io/lizzjin/routepilot-ops-agent:0.1.0}
    pull_policy: ${ROUTEPILOT_PULL_POLICY:-missing}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: ${ROUTEPILOT_OPS_CPU_LIMIT:-0.50}
    mem_limit: ${ROUTEPILOT_OPS_MEMORY_LIMIT:-256m}
    pids_limit: ${ROUTEPILOT_OPS_PIDS_LIMIT:-128}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      ROUTEPILOT_OPS_BASE_URL: http://routepilot:38082
      ROUTEPILOT_OPS_API_KEY: ${ROUTEPILOT_OPS_API_KEY:-}
      ROUTEPILOT_OPS_MODEL_API_KEY: ${ROUTEPILOT_OPS_MODEL_API_KEY:-}
      ROUTEPILOT_OPS_MODE: ${ROUTEPILOT_OPS_MODE:-shadow}
      ROUTEPILOT_OPS_INTERVAL_SECONDS: ${ROUTEPILOT_OPS_INTERVAL_SECONDS:-300}
      ROUTEPILOT_OPS_WEBHOOK_URL: ${ROUTEPILOT_OPS_WEBHOOK_URL:-}
      RUST_LOG: ${ROUTEPILOT_OPS_RUST_LOG:-routepilot_ops_agent=info}
    volumes:
      - routepilot-ops-spool:/var/lib/routepilot-ops
    depends_on:
      routepilot:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${ROUTEPILOT_LOG_MAX_SIZE:-10m}
        max-file: "${ROUTEPILOT_LOG_MAX_FILES:-5}"

volumes:
  routepilot-data:
  routepilot-postgres-18:
  routepilot-ops-spool:

networks:
  default:
    name: ${ROUTEPILOT_NETWORK_NAME:-routepilot_default}
    external: true
