<text x="378" y="382" class="head">Authenticate · parse · resolve model</text>
<text x="378" y="421" class="body">Policy gates · quota / budget admission</text>
<text x="378" y="457" class="body">Route · select credential · bounded fallback</text>
<text x="378" y="493" class="body">Typed Exchange IR ↔ Provider adapters</text>
<text x="378" y="552" class="head">Response mapping &amp; terminal evidence</text>
