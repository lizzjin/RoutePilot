<title id="title">RoutePilot system architecture</title><desc id="desc">Clients send requests through the Rust gateway to local or cloud Providers. The dashboard uses the admin API. PostgreSQL stores operational evidence. Optional tools observe the service.</desc>
<text x="38" y="53" class="title">RoutePilot</text>
<text x="38" y="85" class="body">One request path. Shared policy, routing, and evidence.</text>
<rect x="354" y="116" width="500" height="126" rx="14" fill="#ffffff" stroke="#d2d6ca"/>
<text x="378" y="147" class="eyebrow">CONTROL PLANE</text>
<text x="378" y="178" class="head">React workbench</text>
<text x="378" y="210" class="body">Models · keys · quotas · governance · incidents</text>
